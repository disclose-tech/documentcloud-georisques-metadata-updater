title: "Disclose Georisques Metadata Updater Add-On"
description: Add-On to update metadata of Georisques documents
type: object
documents: []
properties:
  project:
    title: Project
    type: integer
    description: ID of the project holding the Georisques documents
  time_limit:
    title: Time limit
    type: integer
    description: Maximum number of minutes the Add-On should run for. 0 = no limit.
    default: 345
  dry_run:
    title: Dry run
    type: boolean
    description: If checked, no document is modified; the changes that would be made are logged instead.
    default: false
  beautify_titles:
    title: Beautify document titles
    type: boolean
    description: >-
      If checked, documents that have no original_filename metadata get their current
      title saved to original_filename and their title beautified.
    default: false
  max_documents:
    title: Max documents
    type: integer
    description: Maximum number of documents to process in a run (across both phases). 0 = no limit.
    default: 0
categories: 
  - bulk
version: 2

eventOptions:
  name: project
  events:
    - hourly
    - daily
    - weekly