title: "Disclose Georisques Metadata Updater Add-On"
description: Add-On to update metadata of Georisques documents
type: object
documents: []
properties:
  project:
    title: Project
    type: integer
    description: ID of the project holding the Georisques document
  time_limit:
    title: Time limit
    type: integer
    description: Maximum number of minutes the Add-On should run for.
    default: 345
  dry_run:
    title: Dry run
    type: boolean
    description: If checked, no document is modified; the changes that would be made are logged instead.
    default: false
  max_documents:
    title: Max documents
    type: integer
    description: Maximum number of documents to process in a run (across both phases). 0 = no limit.
    default: 0
categories: 
  - bulk
version: 2
